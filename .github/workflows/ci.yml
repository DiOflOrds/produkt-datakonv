# CI (T-0042 + T-0049): unit verification + SWR-test-matrix gate on every push/PR.
# T-0049 (Retro-CR 1/3 Sprint 4): checks out DiOflOrds/platform (read) and runs
# trace_matrix.py --check — matrix gaps break the build.
#
# ONE-TIME SETUP (human): reuse the fine-grained PAT with "Contents: Read" for
# DiOflOrds/platform (same as p0's board-check) and add it in
# DiOflOrds/produkt-datakonv -> Settings -> Secrets and variables -> Actions
# as secret PLATFORM_READ_TOKEN. Without it the run fails with a clear message.
name: CI
on:
  push:
    branches: [main]  # P2/T-0013: keine Tag-Laeufe (alte Commits vs. heutige Repos = Rauschen)
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Secret PLATFORM_READ_TOKEN present?
        env:
          TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret PLATFORM_READ_TOKEN missing (read PAT for DiOflOrds/platform). See workflow header."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/platform
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          path: .platform-tools
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit tests (stdlib only, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: SWR-test-matrix gate (T-0049 — gaps break CI)
        run: >
          python .platform-tools/scripts/trace_matrix.py
          --tests tests
          --swr requirements/software/software-requirements.md
          --ziel /tmp/matrix.md
          --id-muster "SWR-D\d{2}"
          --check
